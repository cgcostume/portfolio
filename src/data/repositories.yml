heading: Repositories

# GitHub accounts and organizations, in display order.
# projects are limited to those I mainly developed or actively contributed to
# project status: active | maintained | inactive | archived

accounts:

- github: cginternals
  name: CG Internals
  thumbnail: gh-cginternals.png
  active: 2013 – today
  summary:
    Open-source C++ and TypeScript libraries for real-time computer graphics of CG Internals, the computer graphics company I co-founded.
    The company has since been dissolved, but some of the libraries are still loosely maintained.
    I initiated and co-designed several of them and was the main developer of webgl-operate.
  projects:
  - name: webgl-operate
    description: TypeScript-based WebGL rendering framework with progressive, multi-frame rendering (main developer).
    status: inactive
  - name: glbinding
    description: Cross-platform C++ binding for the OpenGL API, generated from the gl.xml specification (initiated and co-designed).
    status: maintained
  - name: openll
    description: Open Label Library, an API specification for glyph rendering and labeling in 2D and 3D (iV 2018).
    status: inactive
  - name: blog-demos
    description: Source code for topics discussed in the CG Internals blog.
    status: archived

- github: varg-dev
  name: Visual Analytics Research Group
  thumbnail: gh-varg.png
  active: 2020 – 2024
  summary:
    Research prototypes of the Visual Analytics Research Group at the Hasso Plattner Institute, mostly accompanying publications on treemaps, software visualization, and sensor data visualization.
  projects:
  - name: treemap-hub
    description: Hub for treemap research prototypes and datasets.
    status: inactive
  - name: font-asset-gui
    description: User interface for generating font assets for distance-field based text rendering.
    status: inactive

- github: hpicgs
  name: Computer Graphics Systems Group
  thumbnail: gh-hpicgs.png
  active: 2013 – 2022
  summary:
    Teaching and research code of the Computer Graphics Systems Group at the Hasso Plattner Institute, e.g., lecture sandboxes as well as seminar and student projects I supervised.
  projects: []

- github: cgcostume
  name: Daniel Limberger
  thumbnail: gh-cgcostume.png
  active: 2013 – today
  summary:
    Personal projects and code accompanying my theses and publications.
  projects:
  - name: pubg-maps
    description: Terrain maps (heights and normals) of PlayerUnknown's Battlegrounds and Fortnite.
    status: inactive
  - name: osghimmel
    description: Real-time rendering of day and night sky phenomena for OpenSceneGraph (master's thesis, VMV 2012).
    status: archived
  - name: web3d-treemaps
    description: Dynamic 2.5D treemaps using declarative 3D on the web (Web3D 2016).
    status: archived
  - name: portfolio
    description: Source code of this website.
    status: active

- github: halb3
  name: halb3
  thumbnail: gh-halb3.png
  active: 2021 – 2023
  summary:
    Modular TypeScript packages for building 2.5D visualization tools on the web, from WebGL rendering of points, lines, text, and charts to color schemes, math, and navigation.
  projects:
  - name: math
    description: Math utilities for 2.5D visualization and rendering.
    status: inactive
  - name: colors
    description: Color and color scheme handling for visualization.
    status: inactive
  - name: navigation
    description: Camera navigation for interactive 2.5D and 3D views.
    status: inactive
  - name: auxiliaries
    description: Shared helpers used across the packages.
    status: inactive
